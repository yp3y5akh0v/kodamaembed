[workspace]
resolver = "3"
members = [
    "crates/kodamaembed",
    "crates/kodamaembed-cpu",
    "crates/kodamaembed-cuda",
    "crates/kodamaembed-model",
    "crates/kodamaembed-python",
    "crates/kodamaembed-validate",
    "crates/kodamaembed-vulkan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/yp3y5akh0v/kodamaembed"

[workspace.dependencies]
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
clap = { version = "4.6", features = ["derive"] }
half = "=2.7.1"
kodamaembed = { path = "crates/kodamaembed", version = "0.1.0" }
kodamaembed-cpu = { path = "crates/kodamaembed-cpu", version = "0.1.0" }
kodamaembed-cuda = { path = "crates/kodamaembed-cuda", version = "0.1.0" }
kodamaembed-model = { path = "crates/kodamaembed-model", version = "0.1.0" }
kodamaembed-vulkan = { path = "crates/kodamaembed-vulkan", version = "0.1.0" }
libc = "=0.2.186"
libloading = "0.8"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
rayon = "1.12"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.22.2", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
wasm-bindgen-test = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1

# The double-precision reference forward runs inside GPU tests.
[profile.dev.package.kodamaembed-model]
opt-level = 3

# Unoptimized SIMD kernels slow down tests and debug builds.
[profile.dev.package.kodamaembed-cpu]
opt-level = 3
