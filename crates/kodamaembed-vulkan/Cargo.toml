[package]
name = "kodamaembed-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Vulkan backend for KodamaEmbed: transformer encoders with compute shaders shipped as SPIR-V"
keywords = ["embeddings", "bert", "vulkan", "gpu", "spirv"]
categories = ["science", "hardware-support"]

[dependencies]
ash.workspace = true
half.workspace = true
kodamaembed-model.workspace = true

# The Vulkan loader is a dynamic library, which a wasm target cannot open.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ash = { workspace = true, features = ["loaded"] }

[[test]]
name = "gpu"
path = "tests/gpu/main.rs"
