[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
exclude-dev = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste has no maintained release; it is a compile-time macro of tokenizers, which is pinned for bit-identical tokenization" },
]

[licenses]
allow = [
    "Apache-2.0",
    # target-lexicon, a build dependency of pyo3.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
